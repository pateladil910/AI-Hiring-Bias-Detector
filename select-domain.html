<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Domain | EquiHire AI</title>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/navbar.css"/>
  <script src="js/auth.js"></script>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="container navbar-container">
        <a href="index.html" class="navbar-brand">
          <div class="brand-logo-icon">EQ</div>
          <div class="brand-text">
            <span class="brand-name">Equi<span>Hire</span> AI</span>
          </div>
        </a>
        <ul class="nav-menu"></ul>
        <div class="nav-actions">
           <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="main-content">
    <div class="container">
      
      <div class="text-center" style="margin-bottom: 2rem;">
        <h2>2. Select Assessment Domain</h2>
        <p style="color:var(--text-muted);">Choose the domain that matches your expertise</p>
        <p style="color:var(--primary); font-size:0.85rem; margin-top:0.5rem; font-weight:600;">Note: This is a demo approximation of domain-based job assessment.</p>
      </div>

      <div id="loading" style="text-align:center; padding:2rem;">Loading domains...</div>
      
      <div id="domains-grid" class="grid-3" style="display:none; margin-bottom:2rem;">
         <!-- Domains injected via JS -->
      </div>

      <div class="text-center">
         <button id="start-btn" class="btn btn-primary" style="display:none;" onclick="startAssessment()">Start Assessment</button>
      </div>

    </div>
  </main>
  
  <script src="js/navbar.js"></script>
  <script>
    let selectedDomainId = null;

    document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAuth()) return;
        
        try {
            // Mock domains for demo
            const domains = [
                { id: 'd1', name: 'Frontend React Engineering', desc: 'Core React, Hooks, UI components', skills: ['React', 'JavaScript', 'CSS'], duration: '30 min', format: '5 MCQ + 3 Aptitude + 1 Coding' },
                { id: 'd2', name: 'Backend Node.js API', desc: 'REST, Auth, DB operations', skills: ['Node.js', 'Express', 'SQL'], duration: '30 min', format: '5 MCQ + 3 Aptitude + 1 Coding' },
                { id: 'd3', name: 'Full-Stack JavaScript', desc: 'End-to-end web apps', skills: ['React', 'Node.js', 'MongoDB'], duration: '45 min', format: '10 MCQ + 5 Aptitude + 2 Coding' }
            ];
            renderDomains(domains);
        } catch(e) {
            document.getElementById('loading').textContent = 'Failed to load domains.';
        }
    });

    function renderDomains(domains) {
        document.getElementById('loading').style.display = 'none';
        const grid = document.getElementById('domains-grid');
        grid.style.display = 'grid';
        grid.innerHTML = domains.map(d => `
            <div class="card domain-card" id="card-${d.id}" style="cursor:pointer; transition:all 0.2s; border: 2px solid transparent;" onclick="selectDomain('${d.id}')">
               <h3 style="margin-bottom:0.5rem;">${d.name}</h3>
               <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem;">${d.desc}</p>
               <div style="margin-bottom:1rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
                  ${d.skills.map(s => `<span class="badge" style="background:var(--primary-soft);color:var(--primary);font-size:0.75rem;">${s}</span>`).join('')}
               </div>
               <div style="font-size:0.8rem; font-weight:600; color:var(--text);">⏱ ${d.duration}</div>
               <div style="font-size:0.8rem; color:var(--text-muted); margin-top:0.25rem;">${d.format}</div>
            </div>
        `).join('');
    }

    function selectDomain(id) {
        selectedDomainId = id;
        document.querySelectorAll('.domain-card').forEach(c => c.style.borderColor = 'transparent');
        document.getElementById(`card-${id}`).style.borderColor = 'var(--primary)';
        document.getElementById('start-btn').style.display = 'inline-flex';
    }

    async function startAssessment() {
        if (!selectedDomainId) return;
        
        // Mock API call to start assessment
        // In real app: POST /api/assessment/start
        localStorage.setItem('current_assessment_id', 'demo-assessment-123');
        window.location.href = `assessment.html?id=demo-assessment-123`;
    }
  </script>
</body>
</html>
