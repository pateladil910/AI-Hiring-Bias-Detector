version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hiring_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hiring_bias_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hiring_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hiring_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hiring_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hiring_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hiring_network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: hiring_ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
    networks:
      - hiring_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hiring_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - hiring_network

volumes:
  postgres_data:
  redis_data:

networks:
  hiring_network:
    driver: bridge
