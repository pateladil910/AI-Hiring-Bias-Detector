<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
</head>
<body>
  <header class="glass-header">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span class="logo-shield">🛡️</span>
        <span class="logo-text">EquiHire <span>AI</span></span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
      </nav>
      <div class="nav-actions">

      </div>

  <main style="max-width: 800px; margin: 40px auto; padding: 0 20px; color: var(--text);">
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: var(--space-8); box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center;">
      <span style="font-size: 3rem;">⚡</span>
      <h1 style="font-size: 2rem; margin: 12px 0 6px;">All Systems Operational</h1>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; text-align: left; margin-top: 24px;">
        <div style="padding: 16px; background: var(--background); border-radius: 12px;">
          <div style="font-weight: 700;">Backend API Service</div>
          <div style="color: var(--primary); font-size: 0.85rem; font-weight: 600; margin-top: 4px;">● Operational (Port 5000)</div>
        </div>
        <div style="padding: 16px; background: var(--background); border-radius: 12px;">
          <div style="font-weight: 700;">AI Microservice</div>
          <div style="color: var(--primary); font-size: 0.85rem; font-weight: 600; margin-top: 4px;">● Operational (Port 8000)</div>
        </div>
        <div style="padding: 16px; background: var(--background); border-radius: 12px;">
          <div style="font-weight: 700;">WebSocket Bias Stream</div>
          <div style="color: var(--primary); font-size: 0.85rem; font-weight: 600; margin-top: 4px;">● Connected</div>
        </div>
      </div>
    </div>
  </main>
