<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Assessment Domain — Parity AI Platform</title>
  <link rel="stylesheet" href="../shared/tokens.css"/>
  <link rel="stylesheet" href="../shared/components.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="app-viewport">

  <header id="parity-header" class="parity-header"></header>

  <main class="main-content">

    <div class="domain-header">
      <span class="mono-label">STEP 05 / 12 — DOMAIN SELECTION</span>
      <h1 class="headline-serif">Select Assessment Stack Domain</h1>
      <p class="headline-sub">
        Choose your target specialization. Parity will calibrate MCQ, Coding, and Aptitude questions specific to this domain.
      </p>
    </div>

    <!-- 13 Domain Card Grid -->
    <div class="domain-grid" id="domain-grid">
      <!-- Generated by JS -->
    </div>

    <div class="domain-footer-actions">
      <div class="selected-domain-indicator">
        <span class="mono-label">SELECTED DOMAIN:</span>
        <span class="mono-val text-teal" id="selected-title">None Selected</span>
      </div>

      <button class="btn btn-primary btn-disabled" id="btn-continue" onclick="confirmDomainAndContinue()" disabled>
        Generate Tailored Assessment
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>
    </div>

  </main>

</div>

<script src="../shared/utils.js"></script>
<script src="script.js"></script>
</body>
</html>
